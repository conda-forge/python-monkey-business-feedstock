{% set name = "python-monkey-business" %}
{% set version = "1.0.0" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/python-monkey-business-{{ version }}.tar.gz
  sha256: 9976522989766f00b2aaa24ec96eacb91a6de7b7001d1452079323b071988e0e

build:
  number: 1004
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - ez_setup
    - pip
    - python {{ python_min }}
  run:
    - python >={{ python_min }}
    - six >=1.7.0

test:
  imports:
    - monkeybiz
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/theatlantic/python-monkey-business
  license: BSD-2-Clause
  license_file: LICENSE
  summary: 'Utility functions for monkey-patching python code'
  license_family: BSD

extra:
  recipe-maintainers:
    - kwilcox
